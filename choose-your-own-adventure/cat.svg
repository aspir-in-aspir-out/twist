  <path d="M100 100 Q94 107 88 103 M100 100 Q106 107 112 103" stroke="#3b2a1a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- whiskers -->
  <path d="M80 97 L50 91 M80 101 L50 103 M120 97 L150 91 M120 101 L150 103" stroke="#3b2a1a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- paws -->
  <ellipse cx="80" cy="186" rx="15" ry="8" fill="#f0a04b"/>
  <ellipse cx="120" cy="186" rx="15" ry="8" fill="#f0a04b"/>
