<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect width="200" height="200" rx="20" fill="#fff3df"/>
  <!-- tail -->
  <path d="M148 170 C185 165 192 125 168 105" stroke="#e08a35" stroke-width="12" fill="none" stroke-linecap="round"/>
  <!-- body -->
  <ellipse cx="100" cy="145" rx="52" ry="45" fill="#f0a04b"/>
  <ellipse cx="100" cy="155" rx="28" ry="30" fill="#fbd9a8"/>
  <!-- ears -->
  <polygon points="64,66 70,22 100,50" fill="#f0a04b"/>
  <polygon points="136,66 130,22 100,50" fill="#f0a04b"/>
  <polygon points="72,54 75,33 90,48" fill="#f7b9b0"/>
  <polygon points="128,54 125,33 110,48" fill="#f7b9b0"/>
