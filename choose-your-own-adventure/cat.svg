  <circle cx="100" cy="82" r="42" fill="#f0a04b"/>
  <path d="M91 45 L93 58 M100 43 L100 58 M109 45 L107 58" stroke="#d27a2a" stroke-width="4" stroke-linecap="round"/>
  <!-- eyes -->
  <ellipse cx="84" cy="80" rx="7" ry="9" fill="#3b2a1a"/>
  <ellipse cx="116" cy="80" rx="7" ry="9" fill="#3b2a1a"/>
  <circle cx="86" cy="77" r="2.5" fill="#fff"/>
  <circle cx="118" cy="77" r="2.5" fill="#fff"/>
