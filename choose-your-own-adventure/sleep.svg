<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect width="200" height="200" rx="20" fill="#2f3b5c"/>
  <!-- moon and stars -->
  <circle cx="160" cy="40" r="16" fill="#fff3c4"/>
  <circle cx="168" cy="34" r="14" fill="#2f3b5c"/>
  <circle cx="30" cy="30" r="2" fill="#fff"/>
  <circle cx="70" cy="22" r="1.5" fill="#fff"/>
  <circle cx="110" cy="38" r="2" fill="#fff"/>
  <!-- cushion -->
  <ellipse cx="100" cy="172" rx="88" ry="16" fill="#c05a5a"/>
  <!-- body -->
  <ellipse cx="108" cy="142" rx="66" ry="34" fill="#f0a04b"/>
  <path d="M120 112 Q126 125 120 138 M140 114 Q146 128 140 142" stroke="#d27a2a" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- tail wrapped in front -->
  <path d="M168 150 Q150 182 80 174" stroke="#e08a35" stroke-width="13" fill="none" stroke-linecap="round"/>
  <!-- ears -->
  <polygon points="40,118 42,88 62,106" fill="#f0a04b"/>
  <polygon points="74,104 86,84 92,112" fill="#f0a04b"/>
  <!-- head -->
  <circle cx="64" cy="132" r="30" fill="#f0a04b"/>
  <!-- closed eyes -->
  <path d="M48 130 Q54 135 60 130 M70 130 Q76 135 82 130" stroke="#3b2a1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <polygon points="61,140 69,140 65,145" fill="#e87a8a"/>
  <!-- Zzz -->
  <text x="96" y="92" fill="#ffffff" font-size="16" font-weight="bold" font-family="Arial, sans-serif">z</text>
  <text x="110" y="76" fill="#ffffff" font-size="21" font-weight="bold" font-family="Arial, sans-serif">z</text>
  <text x="128" y="58" fill="#ffffff" font-size="27" font-weight="bold" font-family="Arial, sans-serif">Z</text>
</svg>
