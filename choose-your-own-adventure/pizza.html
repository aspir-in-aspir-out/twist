  <h2>הפיצה של השכן</h2>

  <p>על השולחן במרפסת של השכן נשאר משולש פיצה מאתמול. מיצי טיפסה על המעקה, ריחרחה, ונגסה ביס גדול.</p>

  <p>הקרום היה קשה כמו קרטון, אבל הגבינה... הגבינה הייתה מצוינת.</p>

  <p>בדיוק אז השכן יצא למרפסת. "היי! זאת ארוחת הבוקר שלי!" ומיצי נעלמה במהירות בין השיחים.</p>
