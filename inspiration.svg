<svg xmlns="http://www.w3.org/2000/svg" width="520" height="320" viewBox="0 0 520 320">
  <!-- לוח השראה: נוף בטבע + צבעי האתר -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#48cae4"/>
      <stop offset="0.6" stop-color="#ffafcc"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
  </defs>
  <rect width="520" height="320" fill="url(#sky)"/>
  <!-- sun -->
  <circle cx="400" cy="110" r="46" fill="#ffb703"/>
  <!-- mountains -->
  <polygon points="0,240 110,120 220,240" fill="#9d7bff"/>
  <polygon points="140,240 270,90 400,240" fill="#7b5ce0"/>
  <polygon points="290,240 400,150 520,240" fill="#9d7bff"/>
  <polygon points="248,115 270,90 292,115 280,110 270,118 260,110" fill="#ffffff"/>
  <!-- hills -->
  <path d="M0 250 q130 -50 260 0 t260 0 v70 h-520 z" fill="#52b788"/>
  <path d="M0 280 q130 -30 260 0 t260 0 v40 h-520 z" fill="#2d6a4f"/>
  <!-- trees -->
  <g fill="#1b4332">
    <polygon points="60,270 80,220 100,270"/>
    <polygon points="95,275 112,232 129,275"/>
    <polygon points="420,272 440,215 460,272"/>
  </g>
  <!-- flowers -->
  <g>
    <circle cx="200" cy="295" r="7" fill="#fb6f92"/><circle cx="200" cy="295" r="3" fill="#ffd166"/>
    <circle cx="240" cy="302" r="7" fill="#ffffff"/><circle cx="240" cy="302" r="3" fill="#ffd166"/>
    <circle cx="300" cy="292" r="7" fill="#fb6f92"/><circle cx="300" cy="292" r="3" fill="#ffd166"/>
    <circle cx="350" cy="304" r="7" fill="#9d7bff"/><circle cx="350" cy="304" r="3" fill="#ffd166"/>
  </g>
  <!-- birds -->
  <path d="M150 70 q8 -8 16 0 q8 -8 16 0 M200 50 q6 -6 12 0 q6 -6 12 0" stroke="#1b4332" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
